[project]
name = "bookmark-organizer"
version = "0.1.0"
description = "CLI utility to detect and clean up duplicate bookmarks in Brave and Chrome"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
]

[project.scripts]
bookmark-organizer = "bookmark_organizer.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.uv]
package = true
